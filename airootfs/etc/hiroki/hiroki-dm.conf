# Hiroki Display Manager (hiroki-dm) yapılandırması
# /etc/hiroki/hiroki-dm.conf
#
# AUTO_LOGIN:
#   yes -> Açılışta DEFAULT_USER otomatik giriş yapar, karşılama ekranı atlanır.
#   no  -> Grafik karşılama (giriş) ekranı gösterilir, kullanıcı şifreyle girer.
AUTO_LOGIN=no

# Otomatik girişte kullanılacak varsayılan kullanıcı
DEFAULT_USER=hiroki

# Gerektiğinde oturumu burada zorla (boş bırakılırsa /etc/hiroki/selected-de okunur)
# Geçerli değerler: xfce, kde, gnome, mate, cinnamon, budgie, lxqt, i3wm, openbox, hyprland
SESSION=

# X görüntü ve sanal terminal (VT). Tek kullanıcılı sistemde değiştirmeye gerek yok.
DISPLAY_NUM=:1
VT=1

# Karşılama ekranının oturumu kapatması için beklenen üst zaman (saniye)
KILL_TIMEOUT=40
