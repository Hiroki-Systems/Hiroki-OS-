-- Hiroki OS - Conky (opsiyonel, XFCE widget)
conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'EAEAEA',
    color1 = 'E91E8C',
    color2 = '00D4AA',
    color3 = '2D1B69',
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    use_xft = true,
    font = 'Inter:size=9',
    gap_x = 12,
    gap_y = 40,
    minimum_height = 5,
    minimum_width = 220,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 128,
    stippled_borders = 0,
