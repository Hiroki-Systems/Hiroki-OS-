# Hiroki OS - Neofetch Yapılandırması
# Sakura 1.0

print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "WM Theme" wm_theme
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info cols
}

# Hiroki renkleri
title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="mib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="off"
gtk_shorthand="off"
gtk2="on"
gtk3="on"
de_version="on"

# Hiroki ASCII Logo
# Sakura temalı mor-pembe logo
ascii_distro="hiroki"
ascii_colors=(5 5 5 5 5 5) # mor tonları
ascii_bold="on"

# Görsel
image_backend="ascii"
image_source="auto"

# Renkler
colors=(5 5 1 5 5 5) # Hiroki mor/pembe
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"

# Hiroki özel ascii (eğer ascii_distro=hiroki tanımlı değilse neofetch kendi logosunu kullanır, biz ekstra tanımlıyoruz)
# Bu dosya /usr/share/neofetch/ascii/distro/hiroki'ye de kopyalanmalı

# Bilgi renkleri
# Mor (#2D1B69), Pembe (#E91E8C), Turkuaz (#00D4AA)
