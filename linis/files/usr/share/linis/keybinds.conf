# Linis kısayolları (LINIS_DESIGN.md §9)
# Biçim:  <tuş kombinasyonu> = <komut>
# Mod: mod4 (= Super). Bilinmeyen satırlar sessizce atlanır.

mod4+t           = toggle_tile
mod4+q           = close
mod4+f           = fullscreen
mod4+m           = monocle
mod4+space       = float
mod4+h           = master_dec
mod4+l           = master_inc
mod4+j           = focus_next
mod4+k           = focus_prev
mod4+1           = workspace:1
mod4+2           = workspace:2
mod4+3           = workspace:3
mod4+4           = workspace:4
mod4+shift+1     = move_ws:1
mod4+shift+2     = move_ws:2
mod4+shift+3     = move_ws:3
mod4+shift+4     = move_ws:4
mod4+shift+q     = quit
mod4+shift+r     = restart
mod4+p           = launcher
mod4+v           = boot_video
mod4+Return      = terminal
control+alt+t    = terminal
control+alt+f    = filemgr
